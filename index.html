function EventPreview({ m, hidden }) {
  const { t, data, act, pop, push, replace, F, toast, lang } = useApp();
  const ev = data.events.find(e => e.id === m.id);
  if (!ev) return <Sheet title={t('event')} onClose={pop} hidden={hidden}><p className="empty">{t('notFound')}</p></Sheet>;
  const len = new Date(ev.end_at) - new Date(ev.start_at);
  const occS = m.occStart ? new Date(m.occStart) : new Date(ev.start_at), occE = new Date(occS.getTime() + len);
  const cals = getCals(data);
  const task = ev.task_id && data.tasks.find(x => x.id === ev.task_id);
  const note = ev.note_id && data.notes.find(x => x.id === ev.note_id);
  const rep = !!ev.repeat_rule;
  const lastDay = addDays(occE, -1);
  const when = ev.all_day
    ? F.dateLong(occS) + (len > DAY ? ' – ' + F.dateLong(lastDay) : '')
    : sameDay(occS, new Date(occE.getTime() - 1)) ? `${F.dateLong(occS)} · ${F.time(occS)} – ${F.time(occE)}` : `${F.dt(occS)} – ${F.dt(occE)}`;
  const edit = () => replace({ type: 'event', id: ev.id, occStart: rep ? occS.getTime() : undefined });
  const del = async () => {
    if (!rep) { if (!confirm(t('confirmDelete'))) return; if (await act.deleteEvent(ev.id)) pop(); return; }
    push({ type: 'scope', title: t('deleteEventQ'), options: ['one', 'following', 'all'], onPick: async sc => { if (await act.deleteOccurrence(ev, occS, sc)) pop(); } });
  };
  const dup = async () => { if (await act.duplicateEvent(ev)) { toast(t('duplicated')); pop(); } };
  const sep = lang === 'ar' ? '، ' : ', ';
  return <Sheet title={t('event')} onClose={pop} hidden={hidden}
    footer={<>
      <button className="btn danger ghost" onClick={del}><Icon n="trash" size={18} />{t('delete')}</button>
      <span className="spacer" />
      <button className="btn ghost" onClick={dup} aria-label={t('duplicate')}><Icon n="copy" size={18} /><span className="hide-sm">{t('duplicate')}</span></button>
      <button className="btn primary" onClick={edit}><Icon n="edit" size={16} />{t('edit')}</button>
    </>}>
    <div className="pv-head">
      <span className="pv-dot" style={{ background: evColor(ev, cals) }} />
      <div className="grow">
        <h2 className="pv-title" dir="auto">{ev.title}</h2>
        <p className="pv-when">{when}</p>
        {rep && <p className="pv-sub"><Icon n="repeat" size={15} />{describeRule(ev.repeat_rule, t, F)}</p>}
        {ev.category && <p className="pv-sub"><Icon n="cal" size={15} />{ev.category}</p>}
        {(ev.alert_minutes || []).length > 0 && <p className="pv-sub"><Icon n="bell" size={15} />{ev.alert_minutes.map(a => alertLabel(a, t)).join(sep)}</p>}
      </div>
    </div>
    {task && <div className="linkrow">
      <button className={'chk' + (task.status === 'done' ? ' on' : '')} onClick={() => act.toggleTask(task)} aria-pressed={task.status === 'done'} aria-label={t('markDone')}>{task.status === 'done' && <Icon n="tick" size={14} />}</button>
      <button className={'grow ellip' + (task.status === 'done' ? ' struck' : '')} style={{ textAlign: 'start' }} dir="auto" onClick={() => push({ type: 'task', id: task.id })}>{task.title}</button>
      <span className="muted">{t('task')}</span>
    </div>}
    {note && <button className="linkrow" onClick={() => push({ type: 'note', id: note.id })}><Icon n="note" size={18} /><span className="grow ellip" dir="auto">{note.title || t('untitled')}</span><span className="muted">{t('note')}</span></button>}
    <div className="actions"><button className="btn" onClick={() => act.startTimer({ label: ev.title, task_id: ev.task_id, category: ev.category })}><Icon n="play" size={14} />{t('startTimer')}</button></div>
  </Sheet>;
}

function TaskPreview({ m, hidden }) {
  const { t, data, act, pop, push, replace, F } = useApp();
  const task = data.tasks.find(x => x.id === m.id);
  if (!task) return <Sheet title={t('task')} onClose={pop} hidden={hidden}><p className="empty">{t('notFound')}</p></Sheet>;
  const done = task.status === 'done';
  const d = task.due_at && new Date(task.due_at);
  const kids = data.tasks.filter(x => x.parent_id === task.id);
  const kd = kids.filter(x => x.status === 'done').length;
  const del = async () => { if (!confirm(kids.length ? t('confirmDeleteTask') : t('confirmDelete'))) return; if (await act.deleteTask(task.id)) pop(); };
  const block = () => {
    const s = d && !isEndish(task.due_at) ? d : new Date(startOfDay(d || new Date()).getTime() + 9 * 60 * MIN);
    replace({ type: 'event', draft: { title: task.title, task_id: task.id, start_at: s.toISOString(), end_at: new Date(s.getTime() + 60 * MIN).toISOString() } });
  };
  return <Sheet title={t('task')} onClose={pop} hidden={hidden}
    footer={<>
      <button className="btn danger ghost" onClick={del}><Icon n="trash" size={18} />{t('delete')}</button>
      <span className="spacer" />
      <button className="btn primary" onClick={() => replace({ type: 'task', id: task.id })}><Icon n="edit" size={16} />{t('edit')}</button>
    </>}>
    <div className="pv-head">
      <button className={'chk' + (done ? ' on' : '')} onClick={() => act.toggleTask(task)} aria-pressed={done} aria-label={t('markDone')}>{done && <Icon n="tick" size={14} />}</button>
      <div className="grow">
        <h2 className={'pv-title' + (done ? ' struck' : '')} dir="auto">{task.title}</h2>
        {d && <p className="pv-when">{isEndish(task.due_at) ? F.dateLong(d) : `${F.dateLong(d)} · ${F.time(d)}`}</p>}
        {kids.length > 0 && <p className="pv-sub"><span className="prog"><i style={{ width: (kd / kids.length * 100) + '%' }} /></span>{kd}/{kids.length} {t('subtasks')}</p>}
        {(task.status === 'doing' || (task.tags || []).length > 0) && <p className="pv-sub meta">{task.status === 'doing' && <span className="tagpill" style={{ '--c': STATUS_COLOR.doing }}>{t('ongoing')}</span>}<TagPills names={task.tags} max={10} /></p>}
        {task.details && <p className="pv-sub" dir="auto" style={{ whiteSpace: 'pre-wrap' }}>{task.details}</p>}
      </div>
    </div>
    <div className="actions">
      <button className="btn" onClick={block}><Icon n="cal" size={16} />{t('timeBlock')}</button>
      {d && <button className="btn ghost" onClick={async () => { if (await act.saveTask({ id: task.id, due_at: null })) pop(); }}><Icon n="x" size={16} />{t('removeFromCal')}</button>}
      <button className="btn ghost" onClick={() => act.startTimer({ label: task.title, task_id: task.id })}><Icon n="play" size={14} />{t('startTimer')}</button>
    </div>
  </Sheet>;
}

function CalendarsModal({ m, hidden }) {

function TimerView() {
  const { t, data, act, F } = useApp();
  const running = data.entries.find(e => !e.ended_at);
  const now = useNow(1000);
  const [label, setLabel] = useState('');
  const [taskId, setTaskId] = useState('');
  const [cat, setCat] = useState('');
  const flat = useMemo(() => flattenTasks(data.tasks.filter(x => x.status !== 'done')), [data.tasks]);
  const tTitle = id => (data.tasks.find(x => x.id === id) || {}).title;
  const name = e => e.label || tTitle(e.task_id) || t('untitled');
  const dur = e => (e.ended_at ? new Date(e.ended_at) : now) - new Date(e.started_at);
  const ws = (data.settings && data.settings.week_start) ?? 0;
  const d0 = startOfDay(now), w0 = startOfWeek(now, ws);
  const today = data.entries.filter(e => new Date(e.started_at) >= d0);
  const week = data.entries.filter(e => new Date(e.started_at) >= w0);
  const sum = list => list.reduce((a, e) => a + dur(e), 0);
  const byCat = Object.entries(week.reduce((acc, e) => { const k = e.category || t('uncategorized'); acc[k] = (acc[k] || 0) + dur(e); return acc; }, {})).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...byCat.map(x => x[1]));
  const wdays = Array.from({ length: 7 }, (_, i) => addDays(w0, i)).map(d => ({ d, ms: sum(week.filter(e => sameDay(new Date(e.started_at), d))) }));
  const maxDay = Math.max(1, ...wdays.map(x => x.ms));
  const recent = [];
  data.entries.forEach(e => { if (e.ended_at && recent.length < 6 && !recent.some(r => name(r) === name(e))) recent.push(e); });
  const cats = [...new Set(data.entries.map(e => e.category).filter(Boolean))];
  const start = async o => { if (await act.startTimer(o)) { setLabel(''); setTaskId(''); } };
  const startForm = () => start({ label: label.trim() || tTitle(taskId) || t('untitled'), task_id: taskId || null, category: cat.trim() || null });

  return <div>
    <div className="page-head"><h1>{t('timer')}</h1></div>
    {running ? <div className="tcard live">
      <div className="sub">{t('running')}{running.category ? ` · ${running.category}` : ''}</div>
      <div className="live-name" dir="auto">{name(running)}</div>
      <div className="clock">{fmtClock(dur(running))}</div>
      <button className="btn dark big" onClick={() => act.stopTimer()}><Icon n="stop" size={14} />{t('stop')}</button>
    </div> : <div className="tcard">
      <label className="field"><span>{t('whatWorking')}</span><input type="text" dir="auto" value={label} onChange={e => setLabel(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) startForm(); }} /></label>
      <div className="row">
        <label className="field"><span>{t('task')}</span>
          <select value={taskId} onChange={e => setTaskId(e.target.value)}>
            <option value="">{t('noLink')}</option>
            {flat.map(({ task, depth }) => <option key={task.id} value={task.id}>{'\u00A0\u00A0\u00A0'.repeat(depth) + (depth ? '↳ ' : '') + task.title}</option>)}
          </select></label>
        <label className="field"><span>{t('category')}</span><input type="text" dir="auto" list="cats-tm" value={cat} onChange={e => setCat(e.target.value)} /></label>
      </div>
      <datalist id="cats-tm">{cats.map(c => <option key={c} value={c} />)}</datalist>
      <button className="btn primary big" onClick={startForm}><Icon n="play" size={14} />{t('startBtn')}</button>
      {recent.length > 0 && <div className="section"><h3>{t('recent')}</h3>
        <div className="actions">{recent.map(e => <button key={e.id} className="btn sm" onClick={() => start({ label: e.label, task_id: e.task_id, category: e.category })}><Icon n="play" size={12} /><span dir="auto">{name(e)}</span></button>)}</div>
      </div>}
    </div>}

    <div className="grid2">
      <div className="tcard">
        <div className="card-head"><h2>{t('todayLog')}</h2><span className="num">{fmtDur(sum(today))}</span></div>
        {today.length ? <ul className="tlog">{today.map(e => <li key={e.id}>
          <span className="grow"><b dir="auto">{name(e)}</b><small>{F.time(new Date(e.started_at))} – {e.ended_at ? F.time(new Date(e.ended_at)) : t('running')}{e.category ? ` · ${e.category}` : ''}</small></span>
          <span className="num">{fmtDur(dur(e))}</span>
          <button className="icon-btn" onClick={() => { if (confirm(t('confirmDelete'))) act.deleteEntry(e.id); }} aria-label={t('delete')}><Icon n="trash" size={16} /></button>
        </li>)}</ul> : <p className="empty">{t('noEntries')}</p>}
      </div>
      <div className="tcard">
        <div className="card-head"><h2>{t('thisWeek')}</h2><span className="num">{fmtDur(sum(week))}</span></div>
        <div className="week-days">{wdays.map(x => <div key={x.d.getTime()} className={'wdbar' + (sameDay(x.d, now) ? ' today' : '')} title={fmtDur(x.ms)}>
          <div className="wdtrack"><i style={{ height: (x.ms / maxDay * 100) + '%' }} /></div><span>{F.wd(x.d)}</span>
        </div>)}</div>
        {byCat.map(([k, ms]) => <div key={k} className="bar"><span className="ellip" dir="auto">{k}</span><span className="track"><i style={{ width: (ms / maxCat * 100) + '%' }} /></span><span className="num">{fmtDur(ms)}</span></div>)}
      </div>
    </div>
  </div>;
}

// ---------------- settings ----------------
function SettingsView() {
  const { t, lang, setLang, data, act, toast, F, session, push } = useApp();
  const s = data.settings || {};
  const [perm, setPerm] = useState(() => ('Notification' in window) ? Notification.permission : 'unsupported');
  const [subbed, setSubbed] = useState(false);
  useEffect(() => {
    (async () => {
      try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); setSubbed(!!sub); } catch (e) { }
    })();
  }, []);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const on = perm === 'granted' && subbed;
  const turnOn = async () => {
    const r = await act.enablePush();
    if ('Notification' in window) setPerm(Notification.permission);
    if (r) { setSubbed(true); toast(t('notifOnToast')); }
  };
  const testLocal = async () => {
    try { const reg = await navigator.serviceWorker.ready; await reg.showNotification(t('testTitle'), { body: t('testBody'), icon: 'icon-192.png' }); } catch (e) { toast(e.message); }
  };
  return <div>
    <div className="page-head"><h1>{t('settings')}</h1></div>
    <section className="card">
      <h2>{t('notifications')}</h2>
      <p className="hint">{on ? t('notifOn') : t('notifOff')}</p>
      {isIOS && !standalone && <p className="hint warn">{t('iosHint')}</p>}
      <div className="actions">
        {!on && <button className="btn primary" onClick={turnOn}><Icon n="bell" size={18} />{t('turnOn')}</button>}
        {perm === 'granted' && <button className="btn" onClick={testLocal}>{t('testLocal')}</button>}
        {on && <button className="btn" onClick={async () => { if (await act.testPush()) toast(t('testSent')); }}>{t('testPush')}</button>}
      </div>
    </section>
    <section className="card">
      <h2>{t('defaultAlerts')}</h2>
      <div style={{ marginBottom: 14 }}><AlertEditor value={s.default_alerts || [10]} onChange={v => act.saveSettings({ default_alerts: v })} /></div>
    </section>
    <section className="card">
      <h2>{t('quietHours')}</h2>
      <p className="hint">{t('quietHint')}</p>
      <div className="row">
        <label className="field"><span>{t('from')}</span><input type="time" value={(s.quiet_start || '').slice(0, 5)} onChange={e => act.saveSettings({ quiet_start: e.target.value || null })} /></label>
        <label className="field"><span>{t('to')}</span><input type="time" value={(s.quiet_end || '').slice(0, 5)} onChange={e => act.saveSettings({ quiet_end: e.target.value || null })} /></label>
      </div>
    </section>
    <section className="card">
      <h2>{t('calendar')}</h2>
      <div className="row">
        <label className="field"><span>{t('defaultDuration')}</span>
          <select value={s.default_duration || 60} onChange={e => act.saveSettings({ default_duration: Number(e.target.value) })}>
            {[15, 30, 45, 60, 90, 120].map(x => <option key={x} value={x}>{shortSpan(x, t)}</option>)}
          </select></label>
      </div>
      <div className="actions"><button className="btn" onClick={() => push({ type: 'cals' })}><Icon n="cal" size={18} />{t('manageCals')}</button><button className="btn" onClick={() => push({ type: 'tags' })}><Icon n="flag" size={18} />{t('manageTags')}</button></div>
    </section>
    <section className="card">
      <h2>{t('general')}</h2>
      <div className="row">
        <label className="field"><span>{t('language')}</span>
          <select value={lang} onChange={e => { setLang(e.target.value); act.saveSettings({ lang: e.target.value }); }}><option value="en">English</option><option value="ar">العربية</option></select></label>
        <label className="field"><span>{t('weekStart')}</span>
          <select value={s.week_start ?? 0} onChange={e => act.saveSettings({ week_start: Number(e.target.value) })}>
            {[6, 0, 1].map(d => <option key={d} value={d}>{F.wdLong(new Date(2024, 0, 7 + d))}</option>)}
          </select></label>
      </div>
    </section>
    <section className="card">
      <h2>{t('account')}</h2>
      <p className="hint">{session.user.email}</p>
      <div className="actions"><button className="btn" onClick={() => sb.auth.signOut()}>{t('signOut')}</button></div>
    </section>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
