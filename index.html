<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daftar">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Daftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#16232B; --muted:#5C6B70; --line:#D7DFDC;
  --accent:#0F6B63; --accent-ink:#FFFFFF; --accent-soft:#D6EAE6; --now:#E0A526; --now-ink:#2A1D03; --danger:#B83A26;
  --hour:52px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0F1618; --surface:#172124; --surface-2:#1D292D; --ink:#E4ECEA; --muted:#93A3A6; --line:#2A383C;
    --accent:#4FC1B3; --accent-ink:#06201D; --accent-soft:#1E3B38; --now:#F0B940; --now-ink:#2A1D03; --danger:#E56B57; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.clock{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .grow{flex:1;min-width:0}
.ellip{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
[dir=rtl] .flip{transform:scaleX(-1)}
.ic{flex:none}

/* shell */
.main{padding:16px 16px calc(110px + env(safe-area-inset-bottom));max-width:1180px;width:100%;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .brand{display:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 8px;border-radius:10px;min-width:58px}
.nav button.on{color:var(--accent);font-weight:600}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-inline-end:1px solid var(--line);padding:22px 12px}
  .nav .brand{display:block;padding:0 12px 18px}
  .nav .brand b{display:block;font-size:22px;letter-spacing:-.02em}
  .nav .brand span{font-family:"IBM Plex Sans Arabic";color:var(--muted);font-size:14px}
  .nav button{flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;width:100%}
  .nav button.on{background:var(--accent-soft);color:var(--ink)}
  .main{padding:26px 32px 96px}
}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0;flex:1;min-width:140px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-weight:500;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:14px}
.btn.big{height:46px;padding:0 20px;font-size:16px}
.btn.dark{background:var(--now-ink);color:var(--now);border-color:transparent}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn[aria-pressed=true]{color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;max-width:100%;overflow-x:auto}
.seg button{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{font-size:12px;opacity:.7;margin-inline-start:2px}
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=datetime-local],input[type=date],input[type=time],select,textarea{width:100%;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:80px;line-height:1.55;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.title-input{font-size:20px;font-weight:600;border:0 !important;background:transparent !important;padding:0 !important;height:auto !important;margin-bottom:12px}
.switch{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:2px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.08)}
.sw.none{border:1.5px dashed var(--muted)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.sw.none.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 4px 0 10px;border-radius:8px;background:var(--accent-soft);font-size:13px}
[dir=rtl] .tag{padding:0 10px 0 4px}
.tag-x{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.addsel{width:auto !important;height:30px !important;font-size:13px;padding:0 8px !important}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:var(--surface-2);margin-bottom:8px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0 10px 10px 0;max-width:100%}
.crumb span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.empty{padding:28px 16px;text-align:center;color:var(--muted);margin:0}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.warn{color:var(--danger)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,18,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){ .backdrop{align-items:center;padding:24px} .sheet{max-width:580px;border-radius:16px;max-height:88vh} }
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 18px}
[dir=rtl] .sheet-head{padding:12px 18px 4px 12px}
.sheet-head h2{font-size:14px;font-weight:600;color:var(--muted);margin:0}
.sheet-body{padding:6px 18px 18px;overflow:auto}
.sheet-foot{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.spacer{flex:1}
.section{margin-top:20px}
.section h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;gap:8px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-title{font-size:21px}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:440px}
.tg-head,.tg-allday,.tg-body{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}
@media (max-width:600px){.tg-head,.tg-allday,.tg-body{grid-template-columns:40px repeat(var(--n),minmax(0,1fr))}.tg-hour{font-size:10px}}
.tg-head,.tg-allday{border-bottom:1px solid var(--line)}
.tg-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px}
.tg-day .wd{font-size:12px;color:var(--muted)}
.tg-day .dn{font-size:17px;font-weight:600;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.tg-day.today .dn{background:var(--accent);color:var(--accent-ink)}
.tg-adcell{padding:4px 3px;display:flex;flex-direction:column;gap:3px;border-inline-start:1px solid var(--line);min-width:0}
.tg-gutter{font-size:11px;color:var(--muted);position:relative}
.tg-allday .tg-gutter{display:grid;place-items:center;font-size:10px;text-align:center;line-height:1.2}
.tg-scroll{flex:1;overflow:auto}
.tg-body{position:relative}
.tg-hour{position:absolute;inset-inline-end:6px;transform:translateY(-50%);white-space:nowrap}
.tg-col{position:relative;border-inline-start:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hour);cursor:cell}
.ev{position:absolute;padding:3px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-inline-start:3px solid var(--c);overflow:hidden;font-size:12px;line-height:1.3;display:flex;flex-direction:column;align-items:stretch;z-index:2}
.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:3px;align-items:center}
.ev small{color:var(--muted)}
.ev.done b{text-decoration:line-through;opacity:.6}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;inset-inline-start:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.chip{display:flex;align-items:center;gap:4px;width:100%;padding:2px 6px;border-radius:6px;font-size:12px;background:color-mix(in srgb,var(--c,var(--accent)) 20%,var(--surface));min-width:0;line-height:1.5}
.chip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip small{color:var(--muted);flex:none}
.chip.done span{text-decoration:line-through;opacity:.6}
.chip.task{background:transparent;border:1px dashed var(--muted)}
.mg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mg-wd,.mg-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mg-wd div{padding:8px 4px;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mcell{min-height:104px;padding:4px;border-inline-start:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.mg-grid .mcell:nth-child(7n+1){border-inline-start:0}
.mg-grid .mcell:nth-child(-n+7){border-top:0}
.mcell.out{background:var(--surface-2);color:var(--muted)}
.mnum{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mcell.today .mnum{background:var(--accent);color:var(--accent-ink)}
.more{font-size:11px;color:var(--muted);padding-inline-start:4px}
@media (max-width:600px){ .mcell{min-height:70px;padding:2px} .mcell .chip{font-size:10px;padding:1px 3px} .mcell .chip small{display:none} .hide-sm{display:none} .cal-title{order:-1;flex-basis:100%} }

/* tasks */
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 0}
.tlist.inset{background:var(--surface-2)}
.trow{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;min-height:48px}
.trow:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.title-row{display:flex;align-items:center;gap:12px}
.title-row .title-input{margin-bottom:0}
.title-row+textarea{margin-top:12px}
.trow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.struck{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:10px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.meta>span{display:inline-flex;align-items:center;gap:3px}
.meta .od{color:var(--danger);font-weight:600}
.prog{width:40px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:inline-block}
.prog i{display:block;height:100%;background:var(--accent)}
.prio-1{color:#3B6FD4} .prio-2{color:#C98A12} .prio-3{color:var(--danger)}
.subtree{margin-inline-start:22px;border-inline-start:2px solid var(--line)}
.addrow{display:flex;align-items:center;gap:8px;padding:4px 12px;color:var(--muted)}
.addrow input{border:0 !important;background:transparent !important;height:38px;padding:0 !important;color:var(--ink)}
.rot{transition:transform .15s} .rot.open{transform:rotate(180deg)}

/* notes */
.searchbar{max-width:320px}
.notes-grid{columns:2 200px;column-gap:12px}
@media (min-width:900px){.notes-grid{columns:3 230px}}
.ncard{break-inside:avoid;margin-bottom:12px;width:100%;background:color-mix(in srgb,var(--c,var(--surface)) 15%,var(--surface));border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.ncard h3{margin:0;font-size:16px;font-weight:600;padding-inline-end:16px}
.ncard p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pinmark{position:absolute;top:10px;inset-inline-end:10px;color:var(--accent)}
.note-body{min-height:34vh;border:0 !important;background:transparent !important;padding:0 !important;font-size:16px;line-height:1.65;field-sizing:content;resize:none}

/* timer */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.tcard.live{background:var(--now);color:var(--now-ink);border-color:transparent}
.tcard.live .sub{opacity:.75;font-size:14px}
.live-name{font-size:18px;font-weight:600;margin-top:2px}
.clock{font-size:48px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:8px 0 14px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.card-head h2{font-size:16px;margin:0}
.tlog{list-style:none;margin:0;padding:0}
.tlog li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tlog li:last-child{border-bottom:0}
.tlog b{display:block;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tlog small{color:var(--muted)}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:120px;margin-bottom:16px}
.wdbar{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wdtrack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wdtrack i{width:70%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.wdbar.today span{color:var(--ink);font-weight:600}
.bar{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.grid2{display:grid;gap:16px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}

/* timer pill: the one loud element */
.pill{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;background:var(--now);color:var(--now-ink);border-radius:999px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.pill-main{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;font-weight:600;min-width:0}
.pill .lbl{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:42vw}
.pill .stop{width:34px;height:34px;border-radius:50%;background:var(--now-ink);color:var(--now);display:grid;place-items:center;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--now-ink);animation:blink 1.6s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
@media (min-width:900px){.pill{left:auto;right:28px;transform:none;bottom:28px}}

/* settings & misc */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 6px}
.card .actions{margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:380px}
.wordmark{font-size:44px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1}
.wordmark-ar{font-family:"IBM Plex Sans Arabic";color:var(--muted);font-size:20px;margin:6px 0 28px}
.auth .btn{width:100%;justify-content:center}
.linkbtn{color:var(--accent);font-size:14px;margin-top:14px}

/* ===== iPhone / touch fixes ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* iOS zooms the page when an input is under 16px — keep all fields at 16px */
input[type=text],input[type=email],input[type=password],input[type=search],input[type=datetime-local],input[type=date],input[type=time],select,textarea{font-size:16px}
input.title-input{font-size:20px}
select.addsel{font-size:16px}
/* iOS date/time inputs ignore height and overflow their box */
input[type=date],input[type=datetime-local],input[type=time]{-webkit-appearance:none;appearance:none;display:flex;align-items:center;min-height:40px;line-height:normal;text-align:start}
input::-webkit-date-and-time-value{text-align:start;margin:0}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:28px}
[dir=rtl] select{background-position:16px 50%,11px 50%}
/* use the real visible height on iOS (address bar aware) */
.tg{height:calc(100dvh - 240px - env(safe-area-inset-bottom))}
.sheet{max-height:92dvh}
.sheet-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tg-scroll{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (max-width:600px){
  .main{padding:12px 12px calc(110px + env(safe-area-inset-bottom))}
  h1,.cal-title{font-size:20px}
  .page-head{gap:8px}
  .page-head .seg{width:100%}
  .page-head .seg button{flex:1}
  .searchbar{max-width:none;flex:1 1 100%;order:3}
  .cal-head{gap:8px}
  .cal-head .seg{flex:1}
  .cal-head .seg button{flex:1}
  .tg{height:calc(100dvh - 250px - env(safe-area-inset-bottom));min-height:360px}
  .tg-day .dn{font-size:15px;width:28px;height:28px}
  .ev{padding:2px 4px;font-size:11px}
  .row>*{min-width:130px}
  .sheet-body{padding:6px 14px 16px}
  .sheet-foot{flex-wrap:wrap}
  .notes-grid{columns:2 150px;column-gap:10px}
  .ncard{padding:12px}
  .clock{font-size:40px}
  .bar{grid-template-columns:minmax(70px,96px) 1fr auto}

      moveTask: wrap(async (tk, dir) => {
        const sib = dataRef.current.tasks.filter(x => (x.parent_id || null) === (tk.parent_id || null) && (tk.parent_id || (x.note_id || null) === (tk.note_id || null))).sort(byPos);
        const i = sib.findIndex(x => x.id === tk.id), j = i + dir;
        if (i < 0 || j < 0 || j >= sib.length) return;
        const a = sib[i], b = sib[j];
        const pa = a.position, pb = b.position === pa ? pa + dir : b.position;
        await q(sb.from('tasks').update({ position: pb }).eq('id', a.id));
        await q(sb.from('tasks').update({ position: pa }).eq('id', b.id));
      }),
      saveEvent: wrap(ev => rawSaveEvent(ev)),
      deleteEvent: wrap(id => q(sb.from('events').delete().eq('id', id))),
      duplicateEvent: wrap(ev => rawSaveEvent({ ...ev, id: undefined, note_id: null, task_id: null })),
      changeOccurrence: wrap((base, occS, form, scope) => applyOccurrenceChange(base, occS, form, scope)),
      deleteOccurrence: wrap(async (base, occS, scope) => {
        if (scope === 'one') return rawSaveEvent({ ...base, exdates: [...new Set([...(base.exdates || []), dateKey(occS)])] });
        if (scope === 'following' && new Date(base.start_at) < startOfDay(occS)) return rawSaveEvent({ ...base, repeat_rule: withUntil(base.repeat_rule, addDays(occS, -1)) });
        return q(sb.from('events').delete().eq('id', base.id));
      }),
      quickTask: wrap(async (tk, alertAtDue) => {
        const saved = await q(sb.from('tasks').insert({ ...tk, position: Date.now() }).select().single());
        if (alertAtDue && saved.due_at && new Date(saved.due_at) > new Date()) {
          await q(sb.from('reminders').insert({ task_id: saved.id, title: saved.title, body: tRef.current('taskReminder'), remind_at: saved.due_at }));
        }
        return saved;
      }),
      saveTags: wrap(async (list, renames, removed) => {
        await q(sb.from('user_settings').update({ task_tags: list, updated_at: new Date().toISOString() }).eq('user_id', uid));
        for (const tk of dataRef.current.tasks) {
          if (!tk.tags || !tk.tags.length) continue;
          const nt = [...new Set(tk.tags.map(n => { const r = renames.find(x => x[0] === n); return r ? r[1] : n; }).filter(n => !removed.includes(n)))];
          if (JSON.stringify(nt) !== JSON.stringify(tk.tags)) await q(sb.from('tasks').update({ tags: nt }).eq('id', tk.id));
        }
      }),
      saveCalendars: wrap(async (calendars, renames) => {
        await q(sb.from('user_settings').update({ calendars, updated_at: new Date().toISOString() }).eq('user_id', uid));
        for (const [a, b] of renames) await q(sb.from('events').update({ category: b }).eq('category', a));
      }),
      addReminder: wrap(r => q(sb.from('reminders').insert(r))),
      deleteReminder: wrap(id => q(sb.from('reminders').delete().eq('id', id))),
      startTimer: wrap(async o => { await stopRunning(); return q(sb.from('time_entries').insert({ label: o.label || null, task_id: o.task_id || null, category: o.category || null }).select().single()); }),
      stopTimer: wrap(() => stopRunning()),
      deleteEntry: wrap(id => q(sb.from('time_entries').delete().eq('id', id))),
      saveSettings: wrap(patch => q(sb.from('user_settings').update({ ...patch, updated_at: new Date().toISOString() }).eq('user_id', uid))),
      testPush: wrap(() => q(sb.from('reminders').insert({ title: tRef.current('testTitle'), body: tRef.current('testBody'), remind_at: new Date().toISOString() }))),
      enablePush: wrap(async () => {
        if (VAPID_PUBLIC_KEY.startsWith('YOUR')) throw new Error(tRef.current('vapidMissing'));
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) throw new Error(tRef.current('pushUnsupported'));
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') throw new Error(tRef.current('permDenied'));
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC_KEY) });
        const j = sub.toJSON();
        await q(sb.from('push_subscriptions').upsert({ user_id: uid, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' }));
      }),
    };
  }, [loadAll, toast, uid]);

  // Open an item from a notification tap: "event:<id>" | "task:<id>" | "note:<id>"
  const openTarget = useCallback(str => {
    if (!str) return;
    const [type, id] = str.split(':');
    if (!id || !['event', 'task', 'note'].includes(type)) return;
    if (type === 'event') setTab('calendar');
    push({ type, id });
  }, [push]);
  useEffect(() => {
    if (!ready) return;
    const m = location.hash.match(/open=([^&]+)/);
    if (m) { openTarget(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
  }, [ready]);
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    const h = e => { if (e.data && e.data.type === 'open') loadAll().then(() => openTarget(e.data.open)); };
    navigator.serviceWorker.addEventListener('message', h);
    return () => navigator.serviceWorker.removeEventListener('message', h);
  }, [loadAll, openTarget]);

  const ctx = { t, lang, setLang, F, data, act, push, pop, replace, toast, setTab, session };
  const NAV = [['calendar', 'cal'], ['tasks', 'check'], ['notes', 'note'], ['timer', 'timer'], ['settings', 'gear']];
  const View = { calendar: CalendarView, tasks: TasksView, notes: NotesView, timer: TimerView, settings: SettingsView }[tab] || CalendarView;

  return <Ctx.Provider value={ctx}>
    <div className="shell">
      <nav className="nav" aria-label="Main">
        <div className="brand"><b>Daftar</b><span>دفتر</span></div>
        {NAV.map(([k, ic]) => <button key={k} className={tab === k ? 'on' : ''} aria-current={tab === k ? 'page' : undefined} onClick={() => setTab(k)}><Icon n={ic} size={22} /><span>{t(k)}</span></button>)}
      </nav>
      <main className="main">{ready ? <View /> : <p className="empty">{t('loading')}</p>}</main>
    </div>
    <TimerPill tab={tab} />
    {stack.map((m, i) => <ModalHost key={m.key} m={m} hidden={i < stack.length - 1} />)}
    {toastMsg && <div className="toast" role="status">{toastMsg}</div>}
  </Ctx.Provider>;
}

// ---------------- modal plumbing ----------------
function ModalHost({ m, hidden }) {
  const C = { event: EventModal, task: TaskModal, note: NoteModal, reminder: ReminderModal, quick: QuickAdd, preview: EventPreview, tpreview: TaskPreview, scope: ScopeModal, cals: CalendarsModal, tags: TagsModal }[m.type];
  if (!C) return null;
  return <div style={hidden ? { display: 'none' } : undefined}><C m={m} hidden={hidden} /></div>;
}

function Sheet({ title, onClose, hidden, children, footer }) {
  const closeRef = useRef(onClose); closeRef.current = onClose;
  useEffect(() => {
    if (hidden) return;
    const h = e => { if (e.key === 'Escape') closeRef.current(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [hidden]);
  return <div className="backdrop" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="sheet" role="dialog" aria-modal="true" aria-label={title}>
      <header className="sheet-head"><h2>{title}</h2><button className="icon-btn" onClick={onClose} aria-label="Close"><Icon n="x" /></button></header>
      <div className="sheet-body">{children}</div>
      {footer && <footer className="sheet-foot">{footer}</footer>}
    </div>
  </div>;
}

function AlertEditor({ value, onChange }) {
  const { t } = useApp();
  const v = value || [];
  const [customOpen, setCustomOpen] = useState(false);
  const [n, setN] = useState(30);
  const [unit, setUnit] = useState(1);
  const add = m => onChange([...new Set([...v, m])].sort((a, b) => a - b));
  return <div>
    <div className="tags">
      {v.map(m => <span key={m} className="tag"><Icon n="bell" size={14} />{alertLabel(m, t)}<button type="button" className="tag-x" onClick={() => onChange(v.filter(x => x !== m))} aria-label={t('delete')}><Icon n="x" size={14} /></button></span>)}
      <select className="addsel" value="" onChange={e => {
        const val = e.target.value; if (val === '') return;
        if (val === 'custom') { setCustomOpen(true); return; }
        add(Number(val));
      }}>
        <option value="">+ {t('addAlert')}</option>
        {ALERTS.filter(a => !v.includes(a)).map(a => <option key={a} value={a}>{alertLabel(a, t)}</option>)}
        <option value="custom">{t('customAlert')}</option>
      </select>
    </div>
    {customOpen && <div className="inline-row" style={{ marginTop: 8 }}>
      <input type="number" inputMode="numeric" min="1" className="num-in" value={n} onChange={e => setN(Math.max(1, parseInt(e.target.value, 10) || 1))} />
      <select className="auto" value={unit} onChange={e => setUnit(Number(e.target.value))}>
        <option value={1}>{t('minutesU')}</option><option value={60}>{t('hoursU')}</option><option value={1440}>{t('daysU')}</option><option value={10080}>{t('weeksU')}</option>
      </select>
      <span>{t('beforeU')}</span>
      <button type="button" className="btn sm primary" onClick={() => { add(n * unit); setCustomOpen(false); }}>{t('add')}</button>
      <button type="button" className="icon-btn" onClick={() => setCustomOpen(false)} aria-label={t('cancel')}><Icon n="x" size={16} /></button>
    </div>}
  </div>;
}

function ReminderList({ list }) {
  const { t, F, act } = useApp();
  if (!list.length) return <p className="hint">{t('noReminders')}</p>;

// ---------------- event modal ----------------
function EventModal({ m, hidden }) {
  const { t, data, act, pop, push, toast } = useApp();
  const existing = m.id ? data.events.find(e => e.id === m.id) : null;
  const [f, setF] = useState(() => {
    if (existing) {
      let s = new Date(existing.start_at), e = new Date(existing.end_at);
      if (m.occStart) { const len = e - s; s = new Date(m.occStart); e = new Date(s.getTime() + len); }
      return { ...existing, category: existing.category || '', start_at: s.toISOString(), end_at: e.toISOString() };
    }
    const dd = (data.settings && data.settings.default_duration) || 60;
    const s = m.draft && m.draft.start_at ? new Date(m.draft.start_at) : nextHour(new Date());
    const last = localStorage.getItem('lastCal');
    return { title: '', all_day: false, color: null, alert_minutes: (data.settings && data.settings.default_alerts) || [10], repeat_rule: null, note_id: null, task_id: null, exdates: [], category: last || (getCals(data)[0] || {}).name || '', end_at: new Date(s.getTime() + dd * MIN).toISOString(), ...(m.draft || {}), start_at: s.toISOString() };
  });
  const [lt, setLt] = useState(() => f.task_id ? 'task' : f.note_id ? 'note' : '');
  const flat = useMemo(() => flattenTasks(data.tasks), [data.tasks]);

  if (m.id && !existing) return <Sheet title={t('editEvent')} onClose={pop} hidden={hidden}><p className="empty">{t('notFound')}</p></Sheet>;

  const cals = getCals(data);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const s = new Date(f.start_at), e = new Date(f.end_at);
  const linked = lt === 'task' ? data.tasks.find(x => x.id === f.task_id) : lt === 'note' ? data.notes.find(x => x.id === f.note_id) : null;
  const rep = existing && existing.repeat_rule && m.occStart;
  const occS = m.occStart ? new Date(m.occStart) : null;

  const toggleAllDay = on => {
    if (on) { const d = startOfDay(s); setF(p => ({ ...p, all_day: true, start_at: d.toISOString(), end_at: addDays(d, 1).toISOString() })); }
    else { const d = new Date(startOfDay(s).getTime() + 9 * 60 * MIN); setF(p => ({ ...p, all_day: false, start_at: d.toISOString(), end_at: new Date(d.getTime() + 60 * MIN).toISOString() })); }
  };
  const onStart = v => {
    const ns = fromInput(v); if (!ns || isNaN(ns)) return;
    const dur = e - s;
    setF(p => ({ ...p, start_at: ns.toISOString(), end_at: new Date(ns.getTime() + (dur > 0 ? dur : (p.all_day ? DAY : 60 * MIN))).toISOString() }));
  };
  const onEnd = v => { let ne = fromInput(v); if (!ne || isNaN(ne)) return; if (f.all_day) ne = addDays(ne, 1); set('end_at', ne.toISOString()); };
  const pickLink = (type, id) => {
    const item = type === 'task' ? data.tasks.find(x => x.id === id) : data.notes.find(x => x.id === id);
    setF(p => ({ ...p, task_id: type === 'task' ? (id || null) : null, note_id: type === 'note' ? (id || null) : null, title: p.title || (item && item.title) || '' }));
  };
  const save = async () => {
    if (!f.title.trim()) return toast(t('needTitle'));
    if (e <= s) return toast(t('endAfterStart'));
    const form = { ...f, title: f.title.trim(), category: f.category || null };
    if (rep) {
      push({ type: 'scope', title: t('editEventQ'), options: ['one', 'following', 'all'], onPick: async sc => { if (await act.changeOccurrence(existing, occS, form, sc)) { toast(t('saved')); pop(); } } });
      return;
    }
    const r = await act.saveEvent(form);
    if (r) { if (!existing) localStorage.setItem('lastCal', f.category || ''); toast(t('saved')); pop(); }
  };
  const del = async () => {
    if (rep) { push({ type: 'scope', title: t('deleteEventQ'), options: ['one', 'following', 'all'], onPick: async sc => { if (await act.deleteOccurrence(existing, occS, sc)) pop(); } }); return; }
    if (!confirm(t('confirmDelete'))) return;
    if (await act.deleteEvent(existing.id)) pop();
  };
  const calCol = calColor(cals, f.category) || COLORS[0];

  return <Sheet title={existing ? t('editEvent') : t('newEvent')} onClose={pop} hidden={hidden}
    footer={<>
      {existing && <button className="btn danger ghost" onClick={del}><Icon n="trash" size={18} />{t('delete')}</button>}
      <span className="spacer" />
      <button className="btn primary" onClick={save}>{t('save')}</button>
    </>}>
    <input type="text" className="title-input" dir="auto" placeholder={t('addTitle')} value={f.title} onChange={ev => set('title', ev.target.value)} autoFocus={!existing} />
    <label className="switch"><input type="checkbox" checked={f.all_day} onChange={ev => toggleAllDay(ev.target.checked)} />{t('allDay')}</label>
    <div className="row">
      <label className="field"><span>{t('start')}</span><input type={f.all_day ? 'date' : 'datetime-local'} value={f.all_day ? toDateInput(s) : toInput(s)} onChange={ev => onStart(ev.target.value)} /></label>
      <label className="field"><span>{t('end')}</span><input type={f.all_day ? 'date' : 'datetime-local'} value={f.all_day ? toDateInput(addDays(e, -1)) : toInput(e)} onChange={ev => onEnd(ev.target.value)} /></label>
    </div>
    {!f.all_day && <div className="chips-row" style={{ marginBottom: 14 }}>
      {[15, 30, 45, 60, 90, 120].map(x => <button key={x} type="button" className={'pchip' + (Math.round((e - s) / MIN) === x ? ' on' : '')} onClick={() => set('end_at', new Date(s.getTime() + x * MIN).toISOString())}>{shortSpan(x, t)}</button>)}
    </div>}
    <div className="field"><span>{t('calendarLbl')}</span><CalendarPicker value={f.category || ''} onChange={v => set('category', v)} /></div>
    <div className="field"><span>{t('repeat')}</span><RepeatPicker value={f.repeat_rule} onChange={v => set('repeat_rule', v)} start={s} /></div>
    <div className="field"><span>{t('alerts')}</span><AlertEditor value={f.alert_minutes} onChange={v => set('alert_minutes', v)} /></div>
    <div className="field"><span>{t('color')}</span>
      <div className="swatches">
        <button type="button" className={'sw cal-default' + (!f.color ? ' on' : '')} style={{ '--c': calCol }} onClick={() => set('color', null)} aria-label={t('calDefault')} title={t('calDefault')} />
        {COLORS.map(c => <button type="button" key={c} className={'sw' + (f.color === c ? ' on' : '')} style={{ '--c': c }} onClick={() => set('color', c)} aria-label={c} aria-pressed={f.color === c} />)}
      </div>
    </div>
    <div className="field"><span>{t('linkTo')}</span>
      <div className="row">
        <select value={lt} onChange={ev => { setLt(ev.target.value); setF(p => ({ ...p, task_id: null, note_id: null })); }}>
          <option value="">{t('noLink')}</option><option value="task">{t('task')}</option><option value="note">{t('note')}</option>
        </select>
        {lt === 'task' && <select value={f.task_id || ''} onChange={ev => pickLink('task', ev.target.value)}>
          <option value="">—</option>
          {flat.map(({ task, depth }) => <option key={task.id} value={task.id}>{'\u00A0\u00A0\u00A0'.repeat(depth) + (depth ? '↳ ' : '') + task.title}</option>)}
        </select>}
        {lt === 'note' && <select value={f.note_id || ''} onChange={ev => pickLink('note', ev.target.value)}>
          <option value="">—</option>
          {data.notes.map(n => <option key={n.id} value={n.id}>{n.title || (n.body || '').slice(0, 40) || t('untitled')}</option>)}
        </select>}
      </div>
    </div>
    {linked && <button className="linkrow" onClick={() => push({ type: lt, id: linked.id })}>
      <Icon n={lt === 'task' ? 'check' : 'note'} size={18} />
      <span className={'grow ellip' + (lt === 'task' && linked.status === 'done' ? ' struck' : '')} dir="auto">{linked.title || t('untitled')}</span>
      <span className="muted">{t('open')}</span>
    </button>}
  </Sheet>;
}

// ---------------- tags ----------------
const STATUS_COLOR = { todo: '#5F7380', doing: '#3B6FD4', done: '#0F6B63' };
const defaultTags = t => [
  { name: t('tagTracking'), color: '#C98A12' },
  { name: t('tagWaiting'), color: '#3B6FD4' },
  { name: t('tagUrgent'), color: '#C24A3A' },
  { name: t('tagBlocked'), color: '#8A4FA8' },
  { name: t('tagDelegated'), color: '#3E8E41' },
  { name: t('tagSomeday'), color: '#5F7380' },
];
const savedTags = data => (data.settings && Array.isArray(data.settings.task_tags) && data.settings.task_tags.length) ? data.settings.task_tags : null;
const getTags = (data, t) => savedTags(data) || defaultTags(t);
const tagColor = (tags, name) => (tags.find(x => x.name === name) || {}).color || '#5F7380';
const normTag = s => s.toLowerCase().replace(/[\s_\-]+/g, '');

function TagPills({ names, max = 3 }) {
  const { t, data } = useApp();
  const tags = getTags(data, t);
  const list = names || [];
  return <>{list.slice(0, max).map(n => <span key={n} className="tagpill" style={{ '--c': tagColor(tags, n) }} dir="auto">{n}</span>)}{list.length > max && <span>+{list.length - max}</span>}</>;
}

function TagPicker({ value, onChange }) {
  const { t, data, act, push } = useApp();
  const tags = getTags(data, t);
  const v = value || [];
  const toggle = name => {
    if (!savedTags(data)) act.saveSettings({ task_tags: tags }); // lock in default names on first use
    onChange(v.includes(name) ? v.filter(x => x !== name) : [...v, name]);
  };
  return <div className="chips-row">
    {tags.map(tg => { const on = v.includes(tg.name); return <button type="button" key={tg.name} className={'pchip tagchip' + (on ? ' on' : '')} style={{ '--c': tg.color }} onClick={() => toggle(tg.name)} aria-pressed={on}>{on ? <Icon n="tick" size={14} /> : <i className="dot-c" />}<span dir="auto">{tg.name}</span></button>; })}
    {v.filter(n => !tags.some(x => x.name === n)).map(n => <button type="button" key={n} className="pchip tagchip on" onClick={() => toggle(n)}><Icon n="tick" size={14} /><span dir="auto">{n}</span></button>)}
    <button type="button" className="pchip ghost" onClick={() => push({ type: 'tags' })}><Icon n="edit" size={14} />{t('manageTags')}</button>
  </div>;
}

function StatusSeg({ value, onChange }) {
  const { t } = useApp();
  return <div className="seg status-seg">{[['todo', 'todo'], ['doing', 'ongoing'], ['done', 'completed']].map(([k, l]) =>
    <button key={k} type="button" className={value === k ? 'on' : ''} style={{ '--c': STATUS_COLOR[k] }} onClick={() => onChange(k)}><i className="dot-c" />{t(l)}</button>)}</div>;
}

function TagsModal({ m, hidden }) {
  const { t, data, act, pop, toast } = useApp();
  const [list, setList] = useState(() => getTags(data, t).map(c => ({ ...c, orig: c.name })));
  const set = (i, patch) => setList(l => l.map((c, j) => j === i ? { ...c, ...patch } : c));
  const save = async () => {
    const clean = list.map(c => ({ ...c, name: c.name.trim() })).filter(c => c.name);
    const names = clean.map(c => c.name);
    if (new Set(names.map(normTag)).size !== names.length) return toast(t('tagDup'));
    const renames = clean.filter(c => c.orig && c.orig !== c.name).map(c => [c.orig, c.name]);
    const kept = new Set(clean.map(c => c.orig).filter(Boolean));
    const removed = getTags(data, t).map(c => c.name).filter(n => !kept.has(n));
    if (await act.saveTags(clean.map(c => ({ name: c.name, color: c.color })), renames, removed)) pop();
  };
  return <Sheet title={t('tags')} onClose={pop} hidden={hidden}
    footer={<><span className="spacer" /><button className="btn primary" onClick={save}>{t('save')}</button></>}>
    {list.map((c, i) => <div key={i} className="cal-edit">
      <div className="inline-row">
        <i className="dot-c big" style={{ '--c': c.color }} />
        <input type="text" dir="auto" value={c.name} placeholder={t('tagName')} onChange={e => set(i, { name: e.target.value })} />
        <button className="icon-btn" onClick={() => setList(l => l.filter((_, j) => j !== i))} aria-label={t('delete')}><Icon n="trash" size={18} /></button>
      </div>
      <div className="swatches">{COLORS.map(col => <button type="button" key={col} className={'sw' + (c.color === col ? ' on' : '')} style={{ '--c': col }} onClick={() => set(i, { color: col })} aria-label={col} />)}</div>
    </div>)}
    <button className="btn" onClick={() => setList(l => [...l, { name: '', color: COLORS[l.length % COLORS.length] }])}><Icon n="plus" size={18} />{t('newTag')}</button>
    <p className="hint" style={{ marginTop: 12 }}>{t('tagHint')}</p>
  </Sheet>;
}

// ---------------- tasks ----------------
function AddTask({ parentId = null, noteId = null, dueAt = null, tags = null }) {
  const { t, act, data } = useApp();
  const [v, setV] = useState('');
  const add = async () => {
    const all = getTags(data, t);
    const found = [];
    const title = v.replace(/#([^\s#]+)/g, (m0, w) => {
      const n = normTag(w);
      const tg = all.find(x => normTag(x.name) === n) || (all.filter(x => normTag(x.name).startsWith(n)).length === 1 ? all.find(x => normTag(x.name).startsWith(n)) : null);
      if (tg) { found.push(tg.name); return ''; }
      return m0;
    }).replace(/\s+/g, ' ').trim();
    if (!title) return;
    setV('');
    const tg = [...new Set([...(tags || []), ...found])];
    if (tg.length && !savedTags(data)) act.saveSettings({ task_tags: all });
    await act.saveTask({ title, parent_id: parentId, note_id: noteId, due_at: dueAt, tags: tg });
  };
  return <div className="addrow">
    <Icon n="plus" size={18} />
    <input type="text" dir="auto" value={v} placeholder={parentId ? t('addSubtask') : t('addTaskHint')} onChange={e => setV(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) add(); }} enterKeyHint="done" />
    {v.trim() && <button className="btn sm primary" onClick={add}>{t('add')}</button>}
  </div>;
}

function TaskTree({ parentId = null, noteId = null }) {
  const { data } = useApp();
  const kids = data.tasks.filter(x => parentId ? x.parent_id === parentId : (!x.parent_id && x.note_id === noteId)).sort(byPos);
  return <>{kids.map(k => <TaskRow key={k.id} task={k} />)}<AddTask parentId={parentId} noteId={parentId ? null : noteId} /></>;
}

function TaskRow({ task, showNote, showParent, flat }) {
  const { t, data, act, push, F } = useApp();
  const [open, setOpen] = useState(false);
  const kids = data.tasks.filter(x => x.parent_id === task.id).sort(byPos);
  const done = task.status === 'done';
  const kd = kids.filter(k => k.status === 'done').length;
  const ev = data.events.find(e => e.task_id === task.id);
  const rem = data.reminders.some(r => r.task_id === task.id);
  const note = showNote && task.note_id && data.notes.find(n => n.id === task.note_id);
  const parent = showParent && task.parent_id && data.tasks.find(x => x.id === task.parent_id);
  const d = task.due_at && new Date(task.due_at);
  const endish = d && d.getHours() === 23 && d.getMinutes() === 59;
  const dueTxt = d ? (sameDay(d, new Date()) ? t('today') : F.date(d)) + (endish ? '' : ' ' + F.time(d)) : '';
  const overdue = d && !done && d < new Date();
  const tags = task.tags || [];
  const hasMeta = dueTxt || kids.length > 0 || ev || rem || note || parent || task.priority > 0 || tags.length || task.status === 'doing';
  return <>
    <div className="trow">
      <button className={'chk' + (done ? ' on' : '') + (task.status === 'doing' ? ' doing' : '')} onClick={() => act.toggleTask(task)} aria-label={task.title} aria-pressed={done}>{done && <Icon n="tick" size={14} />}</button>
      <button className="trow-main" onClick={() => push({ type: 'task', id: task.id })}>
        <span className={'ttl' + (done ? ' struck' : '')} dir="auto">{task.title}</span>
        {hasMeta && <span className="meta">
          {task.status === 'doing' && <span className="tagpill" style={{ '--c': STATUS_COLOR.doing }}>{t('ongoing')}</span>}
          <TagPills names={tags} />
          {task.priority > 0 && <span className={'prio-' + task.priority}><Icon n="flag" size={13} /></span>}
          {dueTxt && <span className={overdue ? 'od' : ''}>{dueTxt}</span>}
          {kids.length > 0 && <span><span className="prog"><i style={{ width: (kd / kids.length * 100) + '%' }} /></span>{kd}/{kids.length}</span>}
          {ev && <span><Icon n="cal" size={13} />{F.time(new Date(ev.start_at))}</span>}
          {rem && <span><Icon n="bell" size={13} /></span>}
          {parent && <span className="ellip" dir="auto"><Icon n="up" size={13} />{parent.title}</span>}
          {note && <span className="ellip" dir="auto"><Icon n="note" size={13} />{note.title || t('untitled')}</span>}
        </span>}
      </button>
      {!flat && kids.length > 0 && <button className="icon-btn" onClick={() => setOpen(!open)} aria-expanded={open} aria-label={t('subtasks')}><Icon n="down" size={18} className={'rot' + (open ? ' open' : '')} /></button>}
    </div>
    {open && !flat && <div className="subtree">{kids.map(k => <TaskRow key={k.id} task={k} />)}<AddTask parentId={task.id} /></div>}
  </>;
}

function TasksView() {
  const { t, data } = useApp();
  const [filter, setFilter] = useState('today');
  const [tag, setTag] = useState(null);
  const tags = getTags(data, t);
  const now = new Date(), eod = addDays(startOfDay(now), 1);
  const match = {
    today: x => x.status !== 'done' && x.due_at && new Date(x.due_at) < eod,
    upcoming: x => x.status !== 'done' && x.due_at && new Date(x.due_at) >= eod,
    ongoing: x => x.status === 'doing',
    all: x => x.status !== 'done',
    completed: x => x.status === 'done',
  };
  // With a tag selected, show every task (incl. subtasks) carrying it, as a flat list
  const base = tag ? data.tasks.filter(x => (x.tags || []).includes(tag)) : data.tasks.filter(x => !x.parent_id);
  const sorter = filter === 'today' || filter === 'upcoming' ? (a, b) => new Date(a.due_at) - new Date(b.due_at)
    : filter === 'completed' ? (a, b) => new Date(b.completed_at || 0) - new Date(a.completed_at || 0) : byPos;
  const list = base.filter(match[filter]).sort(sorter);
  const dueFor = filter === 'today' ? endOfDay(now) : filter === 'upcoming' ? endOfDay(addDays(now, 1)) : null;
  const pickTag = n => { const next = tag === n ? null : n; setTag(next); if (next && (filter === 'today' || filter === 'upcoming')) setFilter('all'); };
  const openCount = n => data.tasks.filter(x => x.status !== 'done' && (x.tags || []).includes(n)).length;
  return <div>
    <div className="page-head">
      <h1>{t('tasks')}</h1>
      <div className="seg">{Object.keys(match).map(k => <button key={k} className={filter === k ? 'on' : ''} onClick={() => setFilter(k)}>{t(k)}{k !== 'completed' && <span className="count">{base.filter(match[k]).length}</span>}</button>)}</div>
    </div>
    <div className="cal-filters">
      <button className={'fchip' + (!tag ? ' sel' : '')} style={{ '--c': 'var(--muted)' }} onClick={() => setTag(null)}>{t('allTags')}</button>
      {tags.map(tg => <button key={tg.name} className={'fchip' + (tag === tg.name ? ' sel' : '')} style={{ '--c': tg.color }} onClick={() => pickTag(tg.name)} aria-pressed={tag === tg.name}><i /><span dir="auto">{tg.name}</span><span className="count">{openCount(tg.name)}</span></button>)}
    </div>
    <div className="tlist">
      {filter !== 'completed' && <AddTask dueAt={dueFor && dueFor.toISOString()} tags={tag ? [tag] : null} />}
      {list.length ? list.map(x => <TaskRow key={x.id} task={x} showNote showParent={!!tag} flat={!!tag} />) : <p className="empty">{t('noTasks')}</p>}
    </div>
  </div>;
}

  const presets = [
    [t('in1h'), new Date(Date.now() + 60 * MIN)],
    [t('tonight'), new Date(today.getTime() + 21 * 60 * MIN)],
    [t('tomorrowAm'), new Date(addDays(today, 1).getTime() + 9 * 60 * MIN)],
  ].filter(([, d]) => d > new Date());
  const add = async when => {
    const d = when || fromInput(at);

    <p className="hint ellip" dir="auto">{tg.title}</p>

    <div className="row">

        <select value={rule} onChange={e => setRule(e.target.value)}><option value="">{t('none')}</option><option value="DAILY">{t('daily')}</option><option value={WORKWEEK}>{t('weekdays')}</option><option value="WEEKLY">{t('weekly')}</option><option value="MONTHLY">{t('monthly')}</option></select>

    <button className="btn primary" onClick={() => add()}><Icon n="plus" size={18} />{t('addReminder')}</button>

}

function RepeatPicker({ value, onChange, start }) {
  const { t, F, data } = useApp();

    ['MONTHLY', t('monthlyOn').replace('{n}', start.getDate())],
  ];
  const [custom, setCustom] = useState(() => !presets.some(p => p[0] === (value || '')));
  const r = parseRule(value) || { freq: 'WEEKLY', interval: 1, byday: [start.getDay()], until: null, count: null };
  const upd = patch => onChange(buildRule({ ...r, ...patch }));
  const endMode = r.until ? 'until' : r.count ? 'count' : 'never';
  const order = [0, 1, 2, 3, 4, 5, 6].map(i => (i + ws) % 7);
  return <div>
    <select value={custom ? 'custom' : (value || '')} onChange={e => {
      const v = e.target.value;
      if (v === 'custom') { setCustom(true); onChange(buildRule(r)); }
      else { setCustom(false); onChange(v || null); }
    }}>
      {presets.map(([v, l]) => <option key={v || 'none'} value={v}>{l}</option>)}
      <option value="custom">{t('custom')}</option>
    </select>
    {custom && <div className="custom-box">

function useSwipe(onSwipe, rtl) {
  const st = useRef(null);
  return {
    onTouchStart: e => { const p = e.touches[0]; st.current = { x: p.clientX, y: p.clientY, t: Date.now() }; },
    onTouchEnd: e => {
      const s = st.current; st.current = null;
      if (!s || DRAG.active || e.changedTouches.length !== 1) return;
      const p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - s.t < 700) onSwipe((dx < 0 ? 1 : -1) * (rtl ? -1 : 1));
    },
  };
}

function CalendarView() {
  const { t, data, push, F, act, lang, toast } = useApp();
  const ws = (data.settings && data.settings.week_start) ?? 0;
  const dd = (data.settings && data.settings.default_duration) || 60;
  const [view, setView] = useState(() => { const v = localStorage.getItem('calView'); return VIEWS.includes(v) ? v : (window.innerWidth < 720 ? '3day' : 'week'); });
  const [anchor, setAnchor] = useState(() => startOfDay(new Date()));
  const [schedDays, setSchedDays] = useState(30);
  const [hiddenCals, setHiddenCals] = useState(() => { try { return JSON.parse(localStorage.getItem('hiddenCals') || '[]'); } catch (e) { return []; } });
  useEffect(() => { localStorage.setItem('calView', view); }, [view]);
  useEffect(() => { localStorage.setItem('hiddenCals', JSON.stringify(hiddenCals)); }, [hiddenCals]);
  const cals = getCals(data);
  const toggleCal = name => setHiddenCals(h => h.includes(name) ? h.filter(x => x !== name) : [...h, name]);
  const hasUncat = data.events.some(e => !e.category || !cals.some(c => c.name === e.category));

  const [from, to] = useMemo(() => {
    if (view === 'day') return [anchor, addDays(anchor, 1)];
    if (view === '3day') return [anchor, addDays(anchor, 3)];
    if (view === 'week') { const s = startOfWeek(anchor, ws); return [s, addDays(s, 7)]; }
    if (view === 'schedule') return [anchor, addDays(anchor, schedDays)];
    const s = startOfWeek(new Date(anchor.getFullYear(), anchor.getMonth(), 1), ws);
    return [s, addDays(s, 42)];
  }, [view, anchor, ws, schedDays]);
  const days = useMemo(() => Array.from({ length: Math.round((to - from) / DAY) }, (_, i) => addDays(from, i)), [from, to]);

  const events = useMemo(() => data.events
    .filter(ev => { const known = ev.category && cals.some(c => c.name === ev.category); return !hiddenCals.includes(known ? ev.category : '__none'); })
    .flatMap(ev => occurrences(ev, from, to))
    .map(o => { const tk = o.task_id && data.tasks.find(x => x.id === o.task_id); return { ...o, _color: evColor(o, cals), _done: !!(tk && tk.status === 'done') }; }),
  [data.events, data.tasks, from, to, hiddenCals, cals]);
  const tasks = useMemo(() => hiddenCals.includes('__tasks') ? [] : data.tasks.filter(x => {
    if (!x.due_at || data.events.some(e => e.task_id === x.id)) return false;
    const d = new Date(x.due_at); return d >= from && d < to;
  }), [data.tasks, data.events, from, to, hiddenCals]);

  const step = view === 'day' ? 1 : view === '3day' ? 3 : view === 'week' ? 7 : view === 'schedule' ? 30 : 0;
  const shift = dir => setAnchor(a => step ? addDays(a, step * dir) : new Date(a.getFullYear(), a.getMonth() + dir, 1));
  const goToday = () => { const n = new Date(); setAnchor(view === 'month' ? new Date(n.getFullYear(), n.getMonth(), 1) : startOfDay(n)); };
  const switchView = v => { setView(v); if (v === 'month') setAnchor(a => new Date(a.getFullYear(), a.getMonth(), 1)); else if (view === 'month') { const n = new Date(); setAnchor(a => (n.getMonth() === a.getMonth() && n.getFullYear() === a.getFullYear()) ? startOfDay(n) : a); } };
  const swipe = useSwipe(shift, lang === 'ar');

  const openQuick = (s, e, allDay) => {
    let st = s;
    if (!st) { const now = new Date(); st = (view === 'schedule' || (now >= from && now < to && view !== 'month')) ? nextHour(now) : new Date(anchor.getTime() + 9 * 60 * MIN); }
    push({ type: 'quick', draft: { start_at: st.toISOString(), end_at: (e || new Date(st.getTime() + dd * MIN)).toISOString(), all_day: !!allDay } });
  };
  const onMoveEvent = (occ, ns, ne) => {
    const base = data.events.find(x => x.id === occ.id);
    if (!base) return;
    const form = { ...base, start_at: ns.toISOString(), end_at: ne.toISOString() };
    if (base.repeat_rule) {
      push({ type: 'scope', title: t('moveEventQ'), options: ['one', 'all'], onPick: async sc => { if (await act.changeOccurrence(base, occ._s, form, sc)) toast(t('moved')); } });
    } else act.saveEvent(form).then(r => r && toast(t('moved')));
  };
  const onMoveTask = (task, due) => act.saveTask({ id: task.id, due_at: due.toISOString() }).then(r => r && toast(t('moved')));

  const title = view === 'day' ? F.dateLong(anchor) : (view === 'month' || view === 'schedule') ? F.my(anchor) : F.my(days[Math.floor(days.length / 2)]);

  return <div className="cal">
    <div className="cal-head">
      <label className="cal-title-btn" title={t('jumpTo')}>
        <span className="cal-title">{title}</span><Icon n="down" size={16} />
        <input type="date" className="jump" value={toDateInput(anchor)} aria-label={t('jumpTo')} onChange={e => { const d = fromInput(e.target.value); if (d && !isNaN(d)) setAnchor(view === 'month' ? new Date(d.getFullYear(), d.getMonth(), 1) : startOfDay(d)); }} />
      </label>
      <div className="cal-nav">
        <button className="icon-btn" onClick={() => shift(-1)} aria-label={t('prev')}><Icon n="left" flip /></button>
        <button className="btn sm" onClick={goToday}>{t('today')}</button>
        <button className="icon-btn" onClick={() => shift(1)} aria-label={t('next')}><Icon n="right" flip /></button>
      </div>
      <div className="seg cal-views">{VIEWS.map(v => <button key={v} className={view === v ? 'on' : ''} onClick={() => switchView(v)}>{t('v_' + v)}</button>)}</div>
      <button className="btn primary hide-sm" onClick={() => openQuick()}><Icon n="plus" size={18} />{t('create')}</button>
    </div>
    <div className="cal-filters">
      {cals.map(c => <button key={c.name} className={'fchip' + (hiddenCals.includes(c.name) ? ' off' : '')} style={{ '--c': c.color }} onClick={() => toggleCal(c.name)} aria-pressed={!hiddenCals.includes(c.name)}><i />{c.name}</button>)}
      {hasUncat && <button className={'fchip' + (hiddenCals.includes('__none') ? ' off' : '')} style={{ '--c': COLORS[0] }} onClick={() => toggleCal('__none')}><i />{t('noCalendar')}</button>}
      <button className={'fchip' + (hiddenCals.includes('__tasks') ? ' off' : '')} style={{ '--c': 'var(--muted)' }} onClick={() => toggleCal('__tasks')}><i className="sq" />{t('tasks')}</button>
      <button className="fchip ghost" onClick={() => push({ type: 'cals' })}><Icon n="gear" size={14} />{t('calendars')}</button>
    </div>
    <div {...swipe}>
      {view === 'month' ? <MonthGrid days={days} events={events} tasks={tasks} month={anchor.getMonth()} onDay={d => { setAnchor(d); setView('day'); }} />
        : view === 'schedule' ? <ScheduleView days={days} events={events} tasks={tasks} onMore={() => setSchedDays(n => n + 30)} />
          : <TimeGrid days={days} events={events} tasks={tasks} onCreate={openQuick} onMoveEvent={onMoveEvent} onMoveTask={onMoveTask} onDay={d => { setAnchor(d); setView('day'); }} />}
    </div>
    <button className="fab" onClick={() => openQuick()} aria-label={t('create')}><Icon n="plus" size={26} /></button>
  </div>;
}

function TimeGrid({ days, events, tasks, onCreate, onMoveEvent, onMoveTask, onDay }) {
  const { t, F, push, act } = useApp();
  const scroller = useRef(null), bodyRef = useRef(null);
  const now = useNow(60000);
  const [drag, setDrag] = useState(null);
  const dref = useRef(null);
  const P = useRef({}); P.current = { days, onCreate, onMoveEvent, onMoveTask, push };
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = Math.max(0, (new Date().getHours() - 1) * HOUR); }, []);
  const SNAP = 15;
  const fmtHM = mins => F.time(new Date(2000, 0, 1, 0, Math.round(mins)));

  const H = useRef(null);
  if (!H.current) {
    const minAt = y => { const r = bodyRef.current.getBoundingClientRect(); return (y - r.top) / HOUR * 60; };
    const colAt = x => { const els = bodyRef.current.querySelectorAll('.tg-col'); for (let i = 0; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (x >= r.left && x < r.right) return i; } return null; };
    const blockTouch = e => { if (dref.current && dref.current.active) e.preventDefault(); };
    const cleanup = () => {
      const st = dref.current; if (st && st.timer) clearTimeout(st.timer);
      dref.current = null; DRAG.active = false;
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel); window.removeEventListener('touchmove', blockTouch);
    };
    const update = (st, x, y) => {
      const m = minAt(y);
      if (st.mode === 'create') {
        const a = Math.floor(st.m0 / SNAP) * SNAP, b = Math.floor(m / SNAP) * SNAP;
        const s = clamp(Math.min(a, b), 0, 1440 - SNAP), e = clamp(Math.max(a, b) + SNAP, s + SNAP, 1440);
        st.res = { col: st.col, s, e }; setDrag({ mode: 'create', col: st.col, s, e }); return;
      }
      const dm = Math.round((m - st.m0) / SNAP) * SNAP;
      if (st.mode === 'resize') {
        const e = clamp(st.e + dm, st.s + SNAP, 1440);
        st.res = { col: st.col, s: st.s, e }; setDrag({ mode: 'resize', key: st.key, col: st.col, s: st.s, e, color: st.color, title: st.title }); return;
      }
      const c = colAt(x), col = c === null ? (st.res ? st.res.col : st.col) : c;
      const len = st.e - st.s, s = clamp(st.s + dm, 0, Math.max(0, 1440 - len));
      st.res = { col, s, e: s + len }; setDrag({ mode: 'move', key: st.key, col, s, e: s + len, color: st.color, title: st.title });
    };
    const autoScroll = y => { const sc = scroller.current; if (!sc) return; const r = sc.getBoundingClientRect(); if (y < r.top + 40) sc.scrollTop -= 14; else if (y > r.bottom - 40) sc.scrollTop += 14; };
    const tap = st => {
      const p = P.current;
      if (st.mode === 'create') { const d = p.days[st.col]; p.onCreate(new Date(d.getTime() + Math.floor(st.m0 / 30) * 30 * MIN)); return; }
      if (st.kind === 'task') p.push({ type: 'tpreview', id: st.item.id });
      else p.push({ type: 'preview', id: st.item.id, occStart: st.item._s.getTime() });
    };
    const commit = (st, res) => {
      const p = P.current;
      if (!res) return;
      if (st.mode === 'create') {
        const d = p.days[res.col];
        if (res.e - res.s <= SNAP) p.onCreate(new Date(d.getTime() + res.s * MIN));
        else p.onCreate(new Date(d.getTime() + res.s * MIN), new Date(d.getTime() + res.e * MIN));
        return;
      }
      const dayDelta = res.col - st.col, minDelta = res.s - st.s;
      if (st.kind === 'task') {
        if (!dayDelta && !minDelta) return;
        p.onMoveTask(st.item, new Date(addDays(new Date(st.item.due_at), dayDelta).getTime() + minDelta * MIN)); return;
      }
      const ev = st.item;
      if (st.mode === 'resize') {
        if (res.e === st.e) return;
        p.onMoveEvent(ev, ev._s, new Date(ev._e.getTime() + (res.e - st.e) * MIN)); return;
      }
      if (!dayDelta && !minDelta) return;
      const ns = new Date(addDays(ev._s, dayDelta).getTime() + minDelta * MIN);
      p.onMoveEvent(ev, ns, new Date(ns.getTime() + (ev._e - ev._s)));
    };
    function onMove(e) {
      const st = dref.current; if (!st) return;
      if (Math.abs(e.clientX - st.x0) > 6 || Math.abs(e.clientY - st.y0) > 6) st.moved = true;
      if (!st.active) {
        if (st.touch) { if (st.moved) { cleanup(); setDrag(null); } return; }
        if (!st.moved) return;
        st.active = true; DRAG.active = true;
      }
      autoScroll(e.clientY);
      update(st, e.clientX, e.clientY);
    }
    function onUp() {
      const st = dref.current; if (!st) return;
      const wasActive = st.active, res = st.res;
      cleanup(); setDrag(null);
      if (!wasActive) { if (!st.moved) tap(st); return; }
      commit(st, res);
    }
    function onCancel() { cleanup(); setDrag(null); }
    const begin = (e, info) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (dref.current) cleanup();
      const st = { ...info, x0: e.clientX, y0: e.clientY, m0: minAt(e.clientY), active: false, moved: false, touch: e.pointerType !== 'mouse', res: null };
      dref.current = st;
      if (st.touch) st.timer = setTimeout(() => {
        if (dref.current !== st || st.moved) return;
        st.active = true; DRAG.active = true;
        if (navigator.vibrate) navigator.vibrate(12);

      }, 380);
      window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel); window.addEventListener('touchmove', blockTouch, { passive: false });
    };
    H.current = { begin };
  }
  useEffect(() => () => { DRAG.active = false; }, []);

  const cols = days.map(d => {
    const de = addDays(d, 1);
    const timed = events.filter(e => !e.all_day && e._s < de && e._e > d).map(e => {
      const s = Math.max(0, (Math.max(e._s, d) - d) / MIN), en = Math.min(1440, (Math.min(e._e, de) - d) / MIN);
      return { kind: 'event', ev: e, key: e._key, s, e: Math.max(en, s + 20), realE: en };
    });
    const tt = tasks.filter(x => !isEndish(x.due_at) && sameDay(new Date(x.due_at), d)).map(x => {
      const s = (new Date(x.due_at) - d) / MIN; return { kind: 'task', task: x, key: 't' + x.id, s, e: Math.min(1440, s + 30) };
    });
    return { d, timed: layoutDay([...timed, ...tt]), allDay: events.filter(e => e.all_day && e._s < de && e._e > d), dayTasks: tasks.filter(x => isEndish(x.due_at) && sameDay(new Date(x.due_at), d)) };
  });
  const hours = Array.from({ length: 24 }, (_, h) => h);
  const pos = it => ({ top: it.s / 60 * HOUR, height: Math.max(20, (it.e - it.s) / 60 * HOUR - 2), insetInlineStart: `calc(${it.col} * 100% / ${it.cols})`, width: `calc(100% / ${it.cols} - 3px)` });

  return <div className="tg" style={{ '--n': days.length, '--hour': HOUR + 'px' }}>
    <div className="tg-head">
      <div />
      {cols.map(c => <button key={c.d.getTime()} className={'tg-day' + (sameDay(c.d, now) ? ' today' : '')} onClick={() => onDay(c.d)}><span className="wd">{F.wd(c.d)}</span><span className="dn">{c.d.getDate()}</span></button>)}
    </div>
    <div className="tg-allday">
      <div className="tg-gutter">{t('allDay')}</div>
      {cols.map(c => <div key={c.d.getTime()} className="tg-adcell" onClick={e => { if (e.target === e.currentTarget) onCreate(c.d, null, true); }}>
        {c.allDay.map(e => <EventChip key={e._key} e={e} />)}
        {c.dayTasks.map(x => <TaskChip key={x.id} task={x} />)}
      </div>)}
    </div>
    <div className="tg-scroll" ref={scroller}>
      <div className="tg-body" ref={bodyRef} style={{ height: 24 * HOUR }}>
        <div className="tg-gutter">{hours.map(h => <div key={h} className="tg-hour" style={{ top: h * HOUR }}>{h ? F.hour(new Date(2000, 0, 1, h)) : ''}</div>)}</div>
        {cols.map((c, ci) => <div key={c.d.getTime()} className="tg-col" onPointerDown={e => { if (e.target === e.currentTarget) H.current.begin(e, { mode: 'create', col: ci }); }}>
          {c.timed.map(it => {
            const lifted = drag && drag.key === it.key && drag.mode !== 'create';
            if (it.kind === 'task') {
              const done = it.task.status === 'done';
              return <div key={it.key} role="button" tabIndex={0} className={'tk' + (done ? ' done' : '') + (lifted ? ' lifted' : '')} style={pos(it)}
                onKeyDown={e => { if (e.key === 'Enter') push({ type: 'tpreview', id: it.task.id }); }}
                onPointerDown={e => H.current.begin(e, { mode: 'move', kind: 'task', item: it.task, key: it.key, col: ci, s: it.s, e: it.e, title: it.task.title, color: 'var(--muted)' })}>
                <button className="mini-chk" onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); act.toggleTask(it.task); }} aria-pressed={done} aria-label={it.task.title}><Icon n={done ? 'tick' : 'square'} size={13} /></button>
                <span className="ellip" dir="auto">{it.task.title}</span>
              </div>;
            }
            const ev = it.ev;
            return <div key={it.key} role="button" tabIndex={0} className={'ev' + (ev._done ? ' done' : '') + (lifted ? ' lifted' : '')} style={{ ...pos(it), '--c': ev._color }}
              onKeyDown={e => { if (e.key === 'Enter') push({ type: 'preview', id: ev.id, occStart: ev._s.getTime() }); }}
              onPointerDown={e => H.current.begin(e, { mode: 'move', kind: 'event', item: ev, key: it.key, col: ci, s: it.s, e: it.e, title: ev.title, color: ev._color })}>

              {it.e - it.s >= 40 && <small className="num">{F.time(ev._s)} – {F.time(ev._e)}</small>}
              {it.realE >= it.s + 30 && <span className="rz" onPointerDown={e => { e.stopPropagation(); H.current.begin(e, { mode: 'resize', kind: 'event', item: ev, key: it.key, col: ci, s: it.s, e: it.e, title: ev.title, color: ev._color }); }} />}
            </div>;

            <b dir="auto">{drag.title}</b><small className="num">{fmtHM(drag.s)} – {fmtHM(drag.e)}</small>
          </div>}
          {drag && drag.col === ci && drag.mode === 'create' && <div className="sel" style={{ top: drag.s / 60 * HOUR, height: (drag.e - drag.s) / 60 * HOUR - 2 }}><small className="num">{fmtHM(drag.s)} – {fmtHM(drag.e)}</small></div>}
          {sameDay(c.d, now) && <div className="now" style={{ top: (now - startOfDay(now)) / MIN / 60 * HOUR }} />}
        </div>)}

    </div>

      return <div key={d.getTime()} className={'mcell' + (d.getMonth() !== month ? ' out' : '') + (sameDay(d, today) ? ' today' : '')} role="button" tabIndex={0}
        onClick={() => onDay(d)} onKeyDown={e => { if (e.key === 'Enter') onDay(d); }}>
        <span className="mnum">{d.getDate()}</span>
        {items.slice(0, 3).map(i => <React.Fragment key={i.k}>{i.el}</React.Fragment>)}
        {items.length > 3 && <span className="more">+{items.length - 3}</span>}
      </div>;
    })}</div>
  </div>;
}

function ScheduleView({ days, events, tasks, onMore }) {
  const { t, F, push, act } = useApp();
  const today = new Date();
  const groups = days.map(d => {
    const de = addDays(d, 1);
    return { d, evs: events.filter(e => e._s < de && e._e > d).sort((a, b) => (b.all_day - a.all_day) || (a._s - b._s)), tks: tasks.filter(x => sameDay(new Date(x.due_at), d)) };
  }).filter(g => g.evs.length || g.tks.length || sameDay(g.d, today));
  return <div className="sched">
    {groups.map(g => <div key={g.d.getTime()} className={'sday' + (sameDay(g.d, today) ? ' today' : '')}>
      <div className="sdate"><span className="wd">{F.wd(g.d)}</span><span className="dn">{g.d.getDate()}</span><span className="mo">{F.monShort(g.d)}</span></div>
      <div className="sitems">
        {!g.evs.length && !g.tks.length && <p className="hint" style={{ margin: '10px 0' }}>{t('nothingScheduled')}</p>}

// ---------------- quick add / previews ----------------
function QuickAdd({ m, hidden }) {
  const { t, data, act, pop, replace, toast } = useApp();
  const dd = (data.settings && data.settings.default_duration) || 60;
  const cals = getCals(data);
  const init = m.draft || {};
  const s0 = new Date(init.start_at || nextHour(new Date()));
  const [kind, setKind] = useState(init.kind || 'event');
  const [title, setTitle] = useState('');
  const [allDay, setAllDay] = useState(!!init.all_day);
  const [start, setStart] = useState(s0);
  const [end, setEnd] = useState(() => init.end_at ? new Date(init.end_at) : new Date(s0.getTime() + dd * MIN));
  const [cal, setCal] = useState(() => { const last = localStorage.getItem('lastCal'); return last !== null && (last === '' || cals.some(c => c.name === last)) ? last : (cals[0] ? cals[0].name : ''); });
  const [rule, setRule] = useState(null);
  const [alerts, setAlerts] = useState(() => (data.settings && data.settings.default_alerts) || [10]);
  const [prio, setPrio] = useState(0);
  const [taskAlert, setTaskAlert] = useState(true);
  const [ttags, setTtags] = useState([]);
  const dur = Math.round((end - start) / MIN);
  const setStartKeep = d => { setEnd(new Date(d.getTime() + (end - start))); setStart(d); };

  const eventRow = () => {
    const s = allDay ? startOfDay(start) : start, e = allDay ? addDays(startOfDay(start), 1) : end;
    return { title: title.trim(), start_at: s.toISOString(), end_at: e.toISOString(), all_day: allDay, category: cal || null, color: null, repeat_rule: rule, alert_minutes: alerts, exdates: [], note_id: null, task_id: null };
  };
  const taskRow = () => ({ title: title.trim(), due_at: (allDay ? endOfDay(start) : start).toISOString(), priority: prio, tags: ttags });
  const save = async () => {
    if (!title.trim()) return toast(t('needTitle'));
    if (kind === 'event') {
      if (!allDay && end <= start) return toast(t('endAfterStart'));
      const r = await act.saveEvent(eventRow());
      if (r) { localStorage.setItem('lastCal', cal); pop(); }
    } else {
      const r = await act.quickTask(taskRow(), taskAlert && !allDay);
      if (r) pop();
    }
  };
  const more = async () => {
    if (kind === 'event') { localStorage.setItem('lastCal', cal); replace({ type: 'event', draft: eventRow() }); return; }
    if (!title.trim()) return toast(t('needTitle'));
    const r = await act.quickTask(taskRow(), taskAlert && !allDay);
    if (r && r.id) replace({ type: 'task', id: r.id });
  };

  return <Sheet title={kind === 'event' ? t('newEvent') : t('newTask')} onClose={pop} hidden={hidden}
    footer={<><button className="btn ghost" onClick={more}>{t('moreOptions')}</button><span className="spacer" /><button className="btn primary" onClick={save}>{t('save')}</button></>}>
    <div className="seg full" style={{ marginBottom: 14 }}>
      {['event', 'task'].map(k => <button key={k} className={kind === k ? 'on' : ''} onClick={() => setKind(k)}><Icon n={k === 'event' ? 'cal' : 'check'} size={16} />{t(k)}</button>)}
    </div>
    <input type="text" className="title-input" dir="auto" placeholder={kind === 'event' ? t('addTitle') : t('addTask')} value={title} onChange={e => setTitle(e.target.value)} autoFocus onKeyDown={e => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) save(); }} />
    <label className="switch"><input type="checkbox" checked={allDay} onChange={e => setAllDay(e.target.checked)} />{t('allDay')}</label>
    <div className="row">
      <label className="field"><span>{kind === 'event' ? t('start') : t('due')}</span>
        <input type={allDay ? 'date' : 'datetime-local'} value={allDay ? toDateInput(start) : toInput(start)} onChange={e => {
          const d = fromInput(e.target.value); if (!d || isNaN(d)) return;
          setStartKeep(allDay ? new Date(d.getTime() + (start - startOfDay(start))) : d);
        }} /></label>
      {kind === 'event' && !allDay && <label className="field"><span>{t('end')}</span>
        <input type="datetime-local" value={toInput(end)} onChange={e => { const d = fromInput(e.target.value); if (d && !isNaN(d)) setEnd(d); }} /></label>}
    </div>
    {kind === 'event' && !allDay && <div className="chips-row" style={{ marginBottom: 14 }}>
      {[15, 30, 45, 60, 90, 120].map(x => <button key={x} type="button" className={'pchip' + (dur === x ? ' on' : '')} onClick={() => setEnd(new Date(start.getTime() + x * MIN))}>{shortSpan(x, t)}</button>)}
    </div>}
    {kind === 'event' ? <>
      <div className="field"><span>{t('calendarLbl')}</span><CalendarPicker value={cal} onChange={setCal} /></div>
      <div className="field"><span>{t('repeat')}</span><RepeatPicker value={rule} onChange={setRule} start={start} /></div>
      <div className="field"><span>{t('alerts')}</span><AlertEditor value={alerts} onChange={setAlerts} /></div>
    </> : <>
      <div className="field"><span>{t('priority')}</span><div className="seg">{[0, 1, 2, 3].map(p => <button key={p} className={prio === p ? 'on' : ''} onClick={() => setPrio(p)}>{t('p' + p)}</button>)}</div></div>
      <div className="field"><span>{t('tags')}</span><TagPicker value={ttags} onChange={setTtags} /></div>
      {!allDay && <label className="switch"><input type="checkbox" checked={taskAlert} onChange={e => setTaskAlert(e.target.checked)} />{t('alertAtDue')}</label>}
    </>}
  </Sheet>;
}
